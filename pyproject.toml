[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conduit-tx-mcp"
version = "0.1.0"
description = "MCP server for Conduit TX — exposes jobs, flows, and connectors as Claude tools"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4,<4.0",
    "httpx>=0.27.0",
]

[project.scripts]
conduit-tx-mcp = "conduit_tx_mcp.server:main"
